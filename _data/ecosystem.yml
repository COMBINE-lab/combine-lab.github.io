# Editorial data for the interactive map on the Resources page (/resources/).
#
# Repository facts (stars, language, dates) come from _data/resources_github.yml,
# and descriptions, status and "featured" come from _data/resources.yml. This
# file only adds what those two cannot know:
#
# themes:          the groups bubbles are coloured and clustered by, in order.
#                  Colours live in css/ecosystem.scss as --eco-c-<id>.
# category_themes: maps a resources.yml category to a theme. A curated category
#                  always wins over the per-repo theme below.
# repos:           theme for every repository that is not curated in
#                  resources.yml, plus an optional fallback summary used only
#                  when neither resources.yml nor GitHub has a description.
#                  Repositories missing here are placed by keyword guess.
# links:           how tools connect. from -> to, with kind:
#                    uses  - "from" depends on "to" as a library (derived from
#                            Cargo manifests on 2026-11-12), or runs it
#                    feeds - the output of "from" is an input to "to"
# tasks:           the "I want to..." entry points and the tools each spotlights.

themes:
  - id: tx
    name: "Transcriptomics"
  - id: sc
    name: "Single-cell"
  - id: reads
    name: "Read processing"
  - id: map
    name: "Mapping"
  - id: index
    name: "Sequence indexing"
  - id: dbg
    name: "de Bruijn graph tools"
  - id: lib
    name: "Libraries"
  - id: legacy
    name: "Other and legacy tools"
  - id: papers
    name: "Paper scripts and benchmarks"
  - id: lab
    name: "Lab, docs and writing"

category_themes:
