{% comment %}
Candidate 1: the helix completes the C and turns as a single flat SVG group.
Preserved after approval on 2026-08-17.
{% endcomment %}

<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="-25 -25 150 150"
  aria-hidden="true"
  focusable="false"
  style="overflow: visible;"
>
  <defs>
    <linearGradient
      id="combine-helix-gradient"
      x1="0"
      y1="10"
      x2="0"
      y2="95"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#56c52f" />
      <stop offset="36%" stop-color="#16a8a5" />
      <stop offset="68%" stop-color="#1473d1" />
      <stop offset="100%" stop-color="#6b2ca0" />
    </linearGradient>
    <linearGradient
      id="combine-rung-gradient"
      x1="19"
      y1="0"
      x2="51"
      y2="0"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#6b2ca0" />
      <stop offset="38%" stop-color="#1473d1" />
      <stop offset="72%" stop-color="#16a8a5" />
      <stop offset="90%" stop-color="#56c52f" />
      <stop offset="100%" stop-color="#ff7617" />
    </linearGradient>
  </defs>

  <style>
    .combine_logo_helix {
      animation: combine_logo_helix_turn 7.5s linear infinite;
      transform-box: fill-box;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    @keyframes combine_logo_helix_turn {
      0% {
        transform: perspective(180px) rotateY(0deg);
      }
      84% {
        transform: perspective(180px) rotateY(360deg);
      }
      100% {
        transform: perspective(180px) rotateY(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .combine_logo_helix {
        animation: none;
      }
    }
  </style>

  <!-- These short strokes are the fixed top and bottom of the logo's C. -->
  <g
    fill="none"
    stroke="currentColor"
    stroke-linecap="round"
    stroke-width="7.5"
  >
    <path d="M 28 13 C 42 4, 61 4, 77 16" />
    <path d="M 34 92 C 48 100, 65 98, 79 88" />
  </g>

  <!-- At rest, this helix joins the fixed strokes and completes the C. -->
  <g class="combine_logo_helix">
    <g
      fill="none"
      stroke="url(#combine-helix-gradient)"
      stroke-linecap="round"
      stroke-width="6"
    >
      <path d="M 28 13 C 17 29, 18 42, 34 53 C 52 64, 50 79, 34 92" />
      <path d="M 42 13 C 51 28, 50 42, 34 53 C 16 65, 20 81, 45 92" />
    </g>

    <g
      fill="none"
      stroke="url(#combine-rung-gradient)"
      stroke-linecap="round"
      stroke-width="3"
    >
      <path d="M 29 18 L 44 18" />
      <path d="M 24 25 L 48 25" />
      <path d="M 21 33 L 48 33" />
      <path d="M 23 41 L 45 41" />
      <path d="M 22 65 L 47 65" />
      <path d="M 21 73 L 50 73" />
      <path d="M 25 81 L 49 81" />
      <path d="M 30 88 L 46 88" />
    </g>
  </g>
</svg>
