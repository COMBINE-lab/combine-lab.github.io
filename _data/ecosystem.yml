tasks:
  - id: bulk
    label: "Quantify bulk RNA-seq"
    blurb: "Short-read transcript quantification: salmon end to end, or piscem mapping followed by piscem-infer, with terminus to group transcripts that cannot be told apart."
    repos: ["salmon", "piscem", "piscem-infer", "terminus", "TreeTerminus"]
  - id: long-read
    label: "Quantify long-read RNA-seq"
    blurb: "oarfish quantifies transcripts from long reads; spearfish maps long reads to the transcriptome."
    repos: ["oarfish", "spearfish", "lr_quant_benchmarks"]
  - id: single-cell
    label: "Process single-cell RNA-seq"
    blurb: "simpleaf drives the whole workflow: piscem maps, alevin-fry quantifies, QCatch checks quality. roers and pyroe prepare references."
    repos: ["simpleaf", "alevin-fry", "piscem", "roers", "pyroe", "QCatch", "protocol-estuary", "af-anndata"]
  - id: reads
    label: "Preprocess reads"
    blurb: "Describe a read geometry and transform, filter or reshape reads before mapping."
    repos: ["seqproc", "seq_geom_parser", "seq_geom_xform", "efgdl-spec", "splitp", "mim", "rapidgzip-rust"]
  - id: index
    label: "Build an index or de Bruijn graph"
    blurb: "Construct compacted de Bruijn graphs and the indexes built on them."
    repos: ["cuttlefish", "cf1-rs", "pufferfish", "pufferfish2", "piscem-rs", "sshash-rs", "mazu", "rainbowfish"]
  - id: libraries
    label: "Build on our Rust libraries"
    blurb: "Reusable crates for k-mers, genomic ranges, alignment, RAD files and compressed input."
    repos: ["kmers", "grangers", "libradicl", "wfa2lib-rs", "ksw2rs", "rapidgzip-rust", "seqcol_rs", "kde-rs", "sshash-rs"]
